<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kanonenfieber V6 Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101c;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}#rotate{display:none}main{height:100dvh;display:grid;grid-template-rows:50px minmax(0,1fr) 82px;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}header,footer{display:flex;align-items:center;justify-content:space-around;gap:10px;background:linear-gradient(#354763,#101725);padding:7px 12px;z-index:2}header b{font-size:18px}header em{font-style:normal;color:#ffe052;font-size:12px}button{border:0;border-radius:10px;padding:9px 17px;font-weight:900;color:#1769d2}canvas{display:block;width:100%;height:100%;touch-action:none;background:#17bfff;border-left:8px solid #162133;border-right:8px solid #162133;box-shadow:inset 0 0 35px #0008}footer>span{width:120px;font-weight:900}.red{color:#ff8295}.blue{color:#7bc9ff}#help{min-width:380px;text-align:center;color:#ffe052;font-weight:1000}#help small{display:block;color:#fff;margin-top:3px}.meter{width:210px;height:18px;border:2px solid #bec7d2;background:#090c12;border-radius:11px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1de1ff,#ffe42e,#ff3650)}#msg{position:fixed;top:18%;left:50%;transform:translateX(-50%);font-size:42px;font-weight:1000;text-shadow:0 4px 9px #000;pointer-events:none}@media(orientation:portrait){main{display:none}#rotate{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:1000}}@media(max-height:580px){main{grid-template-rows:42px minmax(0,1fr) 65px}header{font-size:12px}header b{font-size:14px}footer{padding:4px 8px}#help{min-width:300px}.meter{width:170px}}
</style>
</head>
<body>
<div id="rotate">Bitte das iPad ins Querformat drehen.</div>
<main>
<header><b>♛ KANONENFIEBER <em>V6 ARCADE</em></b><span id="turn">Blau am Zug</span><span id="wind">Wind • 0,0 / 12</span><button id="new">NEU</button></header>
<canvas id="game" aria-label="Spielfeld"></canvas>
<footer><span class="blue" id="hp0">Blau 100%</span><div id="help">FINGER AUFLEGEN UND HALTEN<small>Nur das aktive Geschütz pendelt</small></div><div class="meter"><i id="power"></i></div><span class="red" id="hp1">Rot 100%</span></footer>
<div id="msg"></div>
</main>
<script>
(function(){
'use strict';
var canvas=document.getElementById('game');
var ctx=canvas.getContext('2d');
var W=0,H=0,D=1,ground=0,last=performance.now();
var active=0,phase='ready',holding=false,aimDirection=1,powerDirection=1;
var wind=0,targetWind=0,shot=null,gameOver=false,shake=0;
var players=[{hp:100,angle:45,power:55},{hp:100,angle:45,power:55}];
var hills=[],clouds=[],particles=[],craters=[],debris=[];
function byId(id){return document.getElementById(id)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function castle(i){return{x:i?W*0.87:W*0.055,y:ground-98,w:98,h:98}}
function pivot(i){var b=castle(i);return{x:i?b.x+13:b.x+85,y:b.y+18}}
function terrainY(px){var y=ground;for(var i=0;i<hills.length;i++){var m=hills[i],dist=Math.abs(px-m.x);if(dist<m.w)y=Math.min(y,ground-m.h*(1-dist/m.w))}for(var j=0;j<craters.length;j++){var c=craters[j],dx=Math.abs(px-c.x);if(dx<c.r){var bowl=c.depth*Math.sqrt(1-(dx*dx)/(c.r*c.r));y=Math.min(ground,y+bowl)}}return y}
function damageTerrain(px,py){var surface=terrainY(px);if(Math.abs(py-surface)<45){var r=34+Math.random()*18;craters.push({x:px,r:r,depth:r*0.72});for(var i=0;i<18;i++){var a=-Math.PI+Math.random()*Math.PI,speed=70+Math.random()*230;debris.push({x:px,y:surface-3,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-45,r:3+Math.random()*7,life:3.5})}}}
function resize(){var r=canvas.getBoundingClientRect();D=Math.min(window.devicePixelRatio||1,2);W=Math.max(320,r.width);H=Math.max(200,r.height);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);ground=H*0.82;if(!hills.length)reset()}
function reset(){players[0]={hp:100,angle:45,power:55};players[1]={hp:100,angle:45,power:55};active=0;phase='ready';holding=false;wind=0;targetWind=(Math.random()-0.5)*3;shot=null;gameOver=false;shake=0;particles=[];craters=[];debris=[];hills=[{x:W*0.50,w:W*0.16,h:H*0.30},{x:W*0.36,w:W*0.08,h:H*0.13}];clouds=[];for(var i=0;i<6;i++)clouds.push({x:i*W/5,y:45+Math.random()*90,s:0.6+Math.random()*0.55});updateHud();message('König Blau beginnt!',900)}
function updateHud(){byId('turn').textContent=(active?'Rot':'Blau')+' am Zug';byId('wind').textContent='Wind '+(wind<-0.1?'←':wind>0.1?'→':'•')+' '+Math.abs(wind).toFixed(1).replace('.',',')+' / 12';byId('hp0').textContent='Blau '+Math.max(0,Math.ceil(players[0].hp))+'%';byId('hp1').textContent='Rot '+Math.max(0,Math.ceil(players[1].hp))+'%';byId('power').style.width=(phase==='power'?players[active].power:0)+'%';var h=byId('help');if(phase==='ready')h.innerHTML='FINGER AUFLEGEN UND HALTEN<small>Nur das aktive Geschütz pendelt</small>';else if(phase==='aim')h.innerHTML='WINKEL '+Math.round(players[active].angle)+'°<small>Finger loslassen, um den Winkel zu speichern</small>';else if(phase==='power')h.innerHTML='KRAFT '+Math.round(players[active].power)+'%<small>Jetzt tippen, um zu schießen</small>';else if(phase==='flight')h.innerHTML='KUGEL IM FLUG<small>Die helle Linie zeigt die Flugbahn</small>';else h.innerHTML='PARTIE BEENDET<small>NEU startet ein neues Spiel</small>'}
function message(text,ms){byId('msg').textContent=text;if(ms)setTimeout(function(){if(byId('msg').textContent===text)byId('msg').textContent=''},ms)}
function burst(px,py,n,color){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=30+Math.random()*180;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s-35,r:2+Math.random()*6,life:0.45+Math.random()*0.7,color:color||'#ff9a20'})}}
function pointerDown(e){e.preventDefault();if(gameOver||phase==='flight')return;if(phase==='ready'){phase='aim';holding=true}else if(phase==='power'){fire()}updateHud()}
function pointerUp(e){e.preventDefault();if(phase==='aim'){holding=false;phase='power';players[active].power=20;powerDirection=1;updateHud()}}
function fire(){var p=players[active],m=pivot(active),a=p.angle*Math.PI/180,side=active?-1:1;shot={x:m.x+Math.cos(a)*58*side,y:m.y-Math.sin(a)*58,vx:Math.cos(a)*p.power*5.25*side,vy:-Math.sin(a)*p.power*5.25,owner:active,age:0,path:[]};phase='flight';burst(m.x,m.y,20,'#ffd143');shake=5;updateHud()}
function hitsCastle(i){if(!shot)return false;if(i===shot.owner&&shot.age<0.5)return false;var b=castle(i);return shot.x>b.x&&shot.x<b.x+b.w&&shot.y>b.y&&shot.y<ground}
function finishShot(){damageTerrain(shot.x,shot.y);var hit=hitsCastle(0)?0:(hitsCastle(1)?1:-1);burst(shot.x,shot.y,50,'#ff7b18');shake=13;if(hit>=0){players[hit].hp-=25;for(var d=0;d<22;d++){debris.push({x:shot.x,y:shot.y,vx:(Math.random()-0.5)*300,vy:-80-Math.random()*240,r:3+Math.random()*8,life:4})}message(hit===shot.owner?'Eigentreffer!':'Volltreffer!',900);if(players[hit].hp<=0){gameOver=true;phase='over';message('♛ '+(hit?'Blau':'Rot')+' gewinnt! ♛',0)}}else message('Daneben!',650);shot=null;if(!gameOver){active=1-active;phase='ready';targetWind=clamp(targetWind+(Math.random()-0.5)*4,-12,12)}updateHud()}
function update(dt){if(phase==='aim'&&holding){players[active].angle+=aimDirection*44*dt;if(players[active].angle>=80){players[active].angle=80;aimDirection=-1}if(players[active].angle<=10){players[active].angle=10;aimDirection=1}}if(phase==='power'){players[active].power+=powerDirection*88*dt;if(players[active].power>=100){players[active].power=100;powerDirection=-1}if(players[active].power<=20){players[active].power=20;powerDirection=1}}wind+=(targetWind-wind)*dt*0.25;for(var c=0;c<clouds.length;c++){clouds[c].x+=wind*16*dt;if(clouds[c].x>W+100)clouds[c].x=-100;if(clouds[c].x<-100)clouds[c].x=W+100}if(shot){shot.age+=dt;shot.vx+=wind*64*dt;shot.vy+=310*dt;shot.x+=shot.vx*dt;shot.y+=shot.vy*dt;shot.path.push([shot.x,shot.y]);if(shot.path.length>120)shot.path.shift();if(hitsCastle(0)||hitsCastle(1)||shot.y>=terrainY(shot.x)||shot.x<-50||shot.x>W+50||shot.y>H+50)finishShot()}for(var i=particles.length-1;i>=0;i--){var q=particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=160*dt;q.r*=0.985;if(q.life<=0)particles.splice(i,1)}for(var z=debris.length-1;z>=0;z--){var r=debris[z];r.life-=dt;r.vy+=420*dt;r.vx+=wind*2*dt;r.x+=r.vx*dt;r.y+=r.vy*dt;var gy=terrainY(r.x);if(r.y+r.r>gy&&r.vy>0){r.y=gy-r.r;r.vy*=-0.26;r.vx*=0.68}if(r.life<=0)debris.splice(z,1)}shake*=Math.pow(0.02,dt);updateHud()}
function drawCloud(q){ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();ctx.arc(q.x,q.y,23*q.s,0,Math.PI*2);ctx.arc(q.x+29*q.s,q.y-8*q.s,31*q.s,0,Math.PI*2);ctx.arc(q.x+61*q.s,q.y,22*q.s,0,Math.PI*2);ctx.fill()}
function drawCastle(i){var b=castle(i),p=players[i],grad=ctx.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);grad.addColorStop(0,i?'#ff91a2':'#80dcff');grad.addColorStop(0.55,i?'#c51f50':'#1876d4');grad.addColorStop(1,'#20283a');ctx.save();ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowBlur=16;ctx.shadowOffsetY=9;ctx.fillStyle=grad;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.restore();ctx.fillStyle=i?'#ef5274':'#45aaf2';for(var k=0;k<4;k++)ctx.fillRect(b.x+k*25,b.y-14,15,18);ctx.fillStyle='#151b28';ctx.fillRect(b.x+36,b.y+56,27,42);var lost=100-p.hp;ctx.strokeStyle='#171b22';ctx.lineWidth=3;for(var q=0;q<Math.floor(lost/10);q++){var cx=b.x+12+(q*23)%75,cy=b.y+22+(q*31)%62;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+8,cy+7);ctx.lineTo(cx+3,cy+15);ctx.stroke()}if(p.hp<70){ctx.fillStyle='rgba(25,25,30,.55)';ctx.fillRect(b.x+5,b.y+5,(100-p.hp)*0.55,8)}ctx.fillStyle='#ffe35b';ctx.beginPath();ctx.arc(b.x+49,b.y-31,14,0,Math.PI*2);ctx.fill();var m=pivot(i),a=p.angle*Math.PI/180,side=i?-1:1;ctx.strokeStyle=i?'#ffb1bd':'#a5e5ff';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x+Math.cos(a)*50*side,m.y-Math.sin(a)*50);ctx.stroke();ctx.strokeStyle='#202734';ctx.lineWidth=9;ctx.stroke();ctx.lineCap='butt'}
function draw(){ctx.save();ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);var sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0bbcf9');sky.addColorStop(1,'#f66bcf');ctx.fillStyle=sky;ctx.fillRect(-20,-20,W+40,H+40);for(var i=0;i<clouds.length;i++)drawCloud(clouds[i]);var earth=ctx.createLinearGradient(0,ground-H*0.35,0,H);earth.addColorStop(0,'#83ff42');earth.addColorStop(1,'#075e35');ctx.fillStyle=earth;ctx.beginPath();ctx.moveTo(0,ground);for(var px=0;px<=W;px+=4)ctx.lineTo(px,terrainY(px));ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();drawCastle(0);drawCastle(1);if(shot){ctx.save();ctx.strokeStyle='#fff';ctx.shadowColor='#2decff';ctx.shadowBlur=15;ctx.lineWidth=5;ctx.setLineDash([10,6]);ctx.beginPath();for(var s=0;s<shot.path.length;s++){if(s===0)ctx.moveTo(shot.path[s][0],shot.path[s][1]);else ctx.lineTo(shot.path[s][0],shot.path[s][1])}ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#11151d';ctx.beginPath();ctx.arc(shot.x,shot.y,10,0,Math.PI*2);ctx.fill();ctx.restore()}for(var r=0;r<debris.length;r++){var db=debris[r];ctx.save();ctx.translate(db.x,db.y);ctx.rotate((db.x+db.y)*0.04);var dg=ctx.createLinearGradient(-db.r,-db.r,db.r,db.r);dg.addColorStop(0,'#d8c5a4');dg.addColorStop(1,'#3b342d');ctx.fillStyle=dg;ctx.fillRect(-db.r,-db.r,db.r*2,db.r*1.5);ctx.restore()}for(var j=0;j<particles.length;j++){var f=particles[j];ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.restore()}
function frame(now){var dt=Math.min(0.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
canvas.addEventListener('pointerdown',pointerDown,{passive:false});canvas.addEventListener('pointerup',pointerUp,{passive:false});canvas.addEventListener('pointercancel',pointerUp,{passive:false});document.getElementById('new').addEventListener('click',function(e){e.stopPropagation();reset()});window.addEventListener('resize',resize);if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});if(window.caches)caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k)})})}resize();requestAnimationFrame(frame);
})();
</script>
</body></html>
